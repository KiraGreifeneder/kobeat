[package]
name = "kobeat"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kobeatui"
path = "src/bin/kobeatui.rs"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.189"
maud = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
symphonia = { version = "0.6.0", features = ["all-codecs"] }
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread"] }
uuid = "1.25.0"
