[package]
name = "kobeat"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kobeat-native-ui"
path = "src/bin/kobeat-native-ui.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
evdev = "0.13.2"
framebuffer = "0.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
symphonia = { version = "0.6.0", features = ["all-codecs"] }
tracing = "0.1.41"
uuid = { version = "1.25.0", features = ["v4"] }
